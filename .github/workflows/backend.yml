name: backend

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: femopedia
          POSTGRES_PASSWORD: femopedia
          POSTGRES_DB: femopedia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U femopedia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # DJANGO_SECRET_KEY and NEO4J_PASSWORD below are overridden by pytest-env
    # from backend/pyproject.toml's [tool.pytest.ini_options] env list during
    # the pytest step (pytest-env's hook runs tryfirst, before Django settings
    # load), so they take effect only for a step that runs Django outside
    # pytest (e.g. manage.py, a migration check, a Docker build smoke test).
    # conftest.py documents the equivalent for its own inert fallback values.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://femopedia:femopedia@localhost:5432/femopedia
      NEO4J_PASSWORD: ci-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -v -m "not integration"
