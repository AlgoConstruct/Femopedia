[project]
name = "femopedia-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "redis>=5.0",
    "neo4j>=5.26",
    "chromadb>=1.5,<2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-env>=1.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["integration: requires docker compose services to be running"]
env = [
    "DJANGO_SECRET_KEY=test-only-not-a-real-secret",
    "DJANGO_DEBUG=True",
    "DATABASE_URL=postgres://femopedia:femopedia@localhost:5432/femopedia",
    "NEO4J_PASSWORD=femopedia-dev-password",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*.py"]
