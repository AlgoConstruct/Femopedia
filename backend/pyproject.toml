[project]
name = "femopedia-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15,<4",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.11,<1",
    "redis>=5.0,<9",
    # <6 matches the neo4j:5.26-community server pinned in docker-compose.yml;
    # a driver major-version mismatch against the server is the specific risk
    # here, unlike the other pins below which only need a sane ceiling.
    "neo4j>=5.26,<6",
    "chromadb>=1.5,<2",
    "httpx>=0.27,<1",
    "gunicorn>=22.0,<27",
    # Pre-1.0, so a minor bump can change generated output; pinned to the
    # minor that schema.yml was generated from.
    "drf-spectacular>=0.30,<0.31",
    "cryptography>=43,<47",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-env>=1.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "pyyaml>=6.0.3,<7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["integration: requires docker compose services to be running"]
env = [
    "D:DJANGO_SECRET_KEY=test-only-not-a-real-secret",
    "D:DJANGO_DEBUG=True",
    "D:DATABASE_URL=postgres://femopedia:femopedia@localhost:5432/femopedia",
    "D:NEO4J_PASSWORD=femopedia-dev-password",
    "D:IDENTIFIER_PEPPER=test-only-pepper-not-a-real-secret",
    "D:FIELD_ENCRYPTION_KEY=ZmVtb3BlZGlhLXRlc3Qta2V5LW5vdC1hLXNlY3JldCE=",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["I001", "RUF012"]
"apps/core/checks.py" = ["BLE001"]
