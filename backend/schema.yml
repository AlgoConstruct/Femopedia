openapi: 3.0.3
info:
  title: Femopedia API
  version: 0.1.0
  description: 'Anonymous AI health companion. The only credential is a device token:
    call POST /api/devices/ once, keep the returned token on the device, and send
    it as X-Device-Token on every authenticated request. No personal identifier is
    required or accepted.'
paths:
  /api/auth/login/:
    post:
      operationId: login
      description: Signs in by email and password, binding the calling device to the
        matching account. An unknown email and a wrong password answer identically,
        so the endpoint cannot be used to discover whether a given woman has an account
        here.
      summary: Bind the calling device to an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: The calling device is now bound to this account.
        '400':
          description: Invalid email or password.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: Email or password is incorrect.
        '429':
          description: Rate limit exceeded.
  /api/auth/logout/:
    post:
      operationId: logout
      description: 'Deletes the calling device entirely and returns a brand-new anonymous
        device token. Not merely unbinding: on a shared phone, signing out must leave
        an application with nothing in it, rather than a sign-in screen with her history
        one tap behind it.'
      summary: Destroy the calling device and issue a fresh anonymous one
      tags:
      - auth
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: The old device is gone; a fresh anonymous token is issued.
        '401':
          description: Missing or unknown device token.
        '429':
          description: Rate limit exceeded.
  /api/auth/recover/:
    post:
      operationId: recover
      description: 'Sets a new password using a recovery code, and issues a replacement
        code -- the old one is spent, single-use. Deliberately AllowAny: a woman recovering
        an account may be on a new device with no token yet, and requiring one would
        strand exactly the person this endpoint exists for. Every failure -- unknown
        username, wrong code, no code set -- answers identically, so the endpoint
        cannot be used to discover which usernames exist.'
      summary: Reset a password with a recovery code and issue a replacement
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResponse'
          description: The password is reset; this is the replacement code.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverError'
          description: Invalid payload, or the username and code do not match.
        '429':
          description: Rate limit exceeded.
  /api/auth/signup/:
    post:
      operationId: signup
      description: 'Signing up issues no new credential: the caller already holds
        a device token, and this gives that device an owner by setting its account.
        An email signup sends a verification email afterward. A username signup has
        no email to send to, so instead it returns a recovery code -- shown exactly
        once, here, and never again.'
      summary: Create an account and bind the calling device to it
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      security:
      - DeviceToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: Account created and the calling device bound to it. recovery_code
            is present only for a username signup.
        '400':
          description: Invalid payload, or neither an email nor a username.
        '401':
          description: Missing or unknown device token.
        '409':
          description: The calling device is already signed in.
        '429':
          description: Rate limit exceeded.
  /api/auth/verify-email/:
    post:
      operationId: verifyEmail
      description: 'Confirms an email address from the link sent by signup. Deliberately
        AllowAny: she may open the link on a device that has never used the application,
        and requiring a device token there would strand her.'
      summary: Confirm an email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: The identifier is now verified.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailError'
          description: The token is invalid or has expired.
        '429':
          description: Rate limit exceeded.
  /api/devices/:
    post:
      operationId: createDevice
      description: Creates an anonymous device and returns its token. The token is
        shown exactly once; only its SHA-256 hash is stored, so a lost token cannot
        be recovered and a database leak yields no usable credential. No personal
        identifier is required or accepted.
      summary: Issue an anonymous device token
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequestRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeviceResponse'
              examples:
                Created:
                  value:
                    device_id: 3f2a1c64-5b7e-4e0a-9d2c-8e6b1f0a7c41
                    device_token: kR3v9Qw1xTzB7nS5mH2pL8dY4cJ6gA0eUfV-oXbNiZk
          description: Device created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unsupported or malformed locale.
        '429':
          description: Rate limit exceeded.
  /api/health/:
    get:
      operationId: health
      description: Returns 200 whenever the process is serving requests.
      summary: Liveness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/health/deep/:
    get:
      operationId: healthDeep
      description: Reports reachability per datastore. Postgres and Redis are required,
        so either being down returns 503 with status "down". Chroma and Neo4j hold
        derived, rebuildable data, so either being down returns 200 with status "degraded"
        rather than taking the API out of rotation during a rebuild.
      summary: Readiness probe across every datastore
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDeepResponse'
          description: All required services up; status is ok or degraded.
        '503':
          description: A required datastore is unreachable.
  /api/whoami/:
    get:
      operationId: whoami
      description: Returns the id of the device the supplied X-Device-Token resolves
        to. The device id is an opaque UUID and carries no personal information.
      summary: Identify the calling device
      tags:
      - whoami
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
          description: ''
        '401':
          description: Missing or unknown device token.
components:
  schemas:
    CreateDeviceRequestRequest:
      type: object
      properties:
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: ne
    CreateDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_token:
          type: string
      required:
      - device_id
      - device_token
    EmailSignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - email
      - password
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    HealthDeepResponse:
      type: object
      properties:
        status:
          type: string
        services:
          $ref: '#/components/schemas/HealthDeepServices'
      required:
      - services
      - status
    HealthDeepServices:
      type: object
      properties:
        postgres:
          type: boolean
        redis:
          type: boolean
        chroma:
          type: boolean
        neo4j:
          type: boolean
      required:
      - chroma
      - neo4j
      - postgres
      - redis
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LocaleEnum:
      enum:
      - ne
      - ne-Latn
      - hi-Latn
      - en
      type: string
      description: |-
        * `ne` - ne
        * `ne-Latn` - ne-Latn
        * `hi-Latn` - hi-Latn
        * `en` - en
    LoginError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
      required:
      - account_id
    LogoutResponse:
      type: object
      properties:
        device_token:
          type: string
        device_id:
          type: string
          format: uuid
      required:
      - device_id
      - device_token
    RecoverError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    RecoverResponse:
      type: object
      properties:
        recovery_code:
          type: string
      required:
      - recovery_code
    RecoveryRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        recovery_code:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - new_password
      - recovery_code
      - username
    SignupRequest:
      oneOf:
      - $ref: '#/components/schemas/EmailSignupRequest'
      - $ref: '#/components/schemas/UsernameSignupRequest'
    SignupResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        recovery_code:
          type: string
      required:
      - account_id
    UsernameSignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]{3,32}$
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - password
      - username
    VerifyEmailError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    VerifyEmailRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    VerifyEmailResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    WhoamiResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
      required:
      - device_id
  securitySchemes:
    DeviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: The token returned once by POST /api/devices/. The server stores
        only its SHA-256 hash, so it cannot be recovered if the client loses it.
