openapi: 3.0.3
info:
  title: Femopedia API
  version: 0.1.0
  description: 'Anonymous AI health companion. The only credential is a device token:
    call POST /api/devices/ once, keep the returned token on the device, and send
    it as X-Device-Token on every authenticated request. No personal identifier is
    required or accepted.'
paths:
  /api/account/:
    get:
      operationId: accountSummary
      description: Returns the account id, creation time, and the kind and verification
        status of each identifier on the account. Identifier values are encrypted
        at rest and are never returned here.
      summary: Summarize the calling account
      tags:
      - account
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountForbidden'
          description: This device is not signed in.
  /api/account/delete/:
    post:
      operationId: accountDelete
      description: 'Requires the account password: a valid device token alone is never
        sufficient, because the person holding the unlocked phone may not be her.
        Deletion is immediate and hard, with no grace period.'
      summary: Delete the calling account and everything referencing it
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
        required: true
      security:
      - DeviceToken: []
      responses:
        '204':
          description: The account and everything referencing it is gone.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteError'
          description: The password is incorrect.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountForbidden'
          description: This device is not signed in.
  /api/account/devices/:
    get:
      operationId: accountDevices
      description: Returns every device signed in to this account, so she can recognize
        a phone she no longer has, or one someone else now uses. The device token
        hash is never included.
      summary: List every device bound to the calling account
      tags:
      - account
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeviceListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountForbidden'
          description: This device is not signed in.
  /api/account/devices/{device_id}/:
    delete:
      operationId: accountDeviceRevoke
      description: 'Deletes a device belonging to the calling account, dropping a
        phone she no longer has or one someone else now uses. A device id that belongs
        to another account is indistinguishable from one that does not exist: both
        answer 404, never 403, so this cannot be used to confirm who owns a given
        device.'
      summary: Revoke a device bound to the calling account
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - account
      security:
      - DeviceToken: []
      responses:
        '204':
          description: The device is gone.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountForbidden'
          description: This device is not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeviceNotFound'
          description: No such device on this account.
  /api/account/export/:
    post:
      operationId: accountExport
      description: 'Returns the account, its identifiers (decrypted) and its devices
        as a downloadable JSON attachment. Nothing is written to disk on the server:
        the file exists only in this response. Password hashes and device token hashes
        are never included -- they are credentials, not her data.'
      summary: Export everything held about the calling account
      tags:
      - account
      security:
      - DeviceToken: []
      responses:
        '200':
          description: The export, as a JSON file attachment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountForbidden'
          description: This device is not signed in.
  /api/account/password/:
    post:
      operationId: passwordChange
      description: Requires the current password. The calling device must be signed
        in -- an anonymous device has no account to change the password of.
      summary: Change the signed-in account's password
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
          description: The password is changed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
          description: Invalid payload, or the current password is wrong.
        '403':
          description: The calling device is not signed in.
        '429':
          description: Rate limit exceeded.
  /api/auth/login/:
    post:
      operationId: login
      description: Signs in by email and password, binding the calling device to the
        matching account. An unknown email and a wrong password answer identically,
        so the endpoint cannot be used to discover whether a given woman has an account
        here.
      summary: Bind the calling device to an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: The calling device is now bound to this account.
        '400':
          description: Invalid email or password.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: Email or password is incorrect.
        '429':
          description: Rate limit exceeded.
  /api/auth/logout/:
    post:
      operationId: logout
      description: 'Deletes the calling device entirely and returns a brand-new anonymous
        device token. Not merely unbinding: on a shared phone, signing out must leave
        an application with nothing in it, rather than a sign-in screen with her history
        one tap behind it.'
      summary: Destroy the calling device and issue a fresh anonymous one
      tags:
      - auth
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: The old device is gone; a fresh anonymous token is issued.
        '401':
          description: Missing or unknown device token.
        '429':
          description: Rate limit exceeded.
  /api/auth/password-reset/:
    post:
      operationId: passwordReset
      description: 'Always answers 202, whatever happens -- known address, unverified
        address, or no such address at all. Any difference between ''sent'' and ''no
        such address'' would turn this unauthenticated endpoint into a way to ask
        whether a given woman has an account here. Mail goes out only when the address
        exists and is verified: an unverified address may belong to someone else entirely.'
      summary: Request a password reset email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: Always returned, regardless of whether mail was sent.
        '400':
          description: Invalid payload.
        '429':
          description: Rate limit exceeded.
  /api/auth/password-reset/confirm/:
    post:
      operationId: passwordResetConfirm
      description: 'Consumes the token from the link sent by password_reset. The token
        signs a fingerprint of the current password hash, so setting a new password
        immediately invalidates every token issued before it -- a used or superseded
        link cannot be replayed. Deliberately AllowAny: she may be opening the link
        on a device that has never used the application.'
      summary: Choose a new password from a reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: The password is changed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmError'
          description: The token is invalid, expired, or already used.
        '429':
          description: Rate limit exceeded.
  /api/auth/recover/:
    post:
      operationId: recover
      description: 'Sets a new password using a recovery code, and issues a replacement
        code -- the old one is spent, single-use. Deliberately AllowAny: a woman recovering
        an account may be on a new device with no token yet, and requiring one would
        strand exactly the person this endpoint exists for. Every failure -- unknown
        username, wrong code, no code set -- answers identically, so the endpoint
        cannot be used to discover which usernames exist.'
      summary: Reset a password with a recovery code and issue a replacement
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResponse'
          description: The password is reset; this is the replacement code.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverError'
          description: Invalid payload, or the username and code do not match.
        '429':
          description: Rate limit exceeded.
  /api/auth/signup/:
    post:
      operationId: signup
      description: 'Signing up issues no new credential: the caller already holds
        a device token, and this gives that device an owner by setting its account.
        An email signup sends a verification email afterward. A username signup has
        no email to send to, so instead it returns a recovery code -- shown exactly
        once, here, and never again.'
      summary: Create an account and bind the calling device to it
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      security:
      - DeviceToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: Account created and the calling device bound to it. recovery_code
            is present only for a username signup.
        '400':
          description: Invalid payload, or neither an email nor a username.
        '401':
          description: Missing or unknown device token.
        '409':
          description: The calling device is already signed in.
        '429':
          description: Rate limit exceeded.
  /api/auth/verify-email/:
    post:
      operationId: verifyEmail
      description: 'Confirms an email address from the link sent by signup. Deliberately
        AllowAny: she may open the link on a device that has never used the application,
        and requiring a device token there would strand her.'
      summary: Confirm an email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: The identifier is now verified.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailError'
          description: The token is invalid or has expired.
        '429':
          description: Rate limit exceeded.
  /api/devices/:
    post:
      operationId: createDevice
      description: Creates an anonymous device and returns its token. The token is
        shown exactly once; only its SHA-256 hash is stored, so a lost token cannot
        be recovered and a database leak yields no usable credential. No personal
        identifier is required or accepted.
      summary: Issue an anonymous device token
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequestRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeviceResponse'
              examples:
                Created:
                  value:
                    device_id: 3f2a1c64-5b7e-4e0a-9d2c-8e6b1f0a7c41
                    device_token: kR3v9Qw1xTzB7nS5mH2pL8dY4cJ6gA0eUfV-oXbNiZk
          description: Device created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unsupported or malformed locale.
        '429':
          description: Rate limit exceeded.
  /api/health/:
    get:
      operationId: health
      description: Returns 200 whenever the process is serving requests.
      summary: Liveness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/health/deep/:
    get:
      operationId: healthDeep
      description: Reports reachability per datastore. Postgres and Redis are required,
        so either being down returns 503 with status "down". Chroma and Neo4j hold
        derived, rebuildable data, so either being down returns 200 with status "degraded"
        rather than taking the API out of rotation during a rebuild.
      summary: Readiness probe across every datastore
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDeepResponse'
          description: All required services up; status is ok or degraded.
        '503':
          description: A required datastore is unreachable.
  /api/whoami/:
    get:
      operationId: whoami
      description: Returns the id of the device the supplied X-Device-Token resolves
        to. The device id is an opaque UUID and carries no personal information.
      summary: Identify the calling device
      tags:
      - whoami
      security:
      - DeviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
          description: ''
        '401':
          description: Missing or unknown device token.
components:
  schemas:
    AccountDeleteError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AccountDeleteRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    AccountDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        last_seen:
          type: string
          format: date-time
        bound_at:
          type: string
          format: date-time
          nullable: true
        is_current:
          type: boolean
      required:
      - bound_at
      - id
      - is_current
      - label
      - last_seen
    AccountDeviceListResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/AccountDevice'
      required:
      - devices
    AccountDeviceNotFound:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AccountForbidden:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AccountIdentifierSummary:
      type: object
      properties:
        kind:
          type: string
        verified:
          type: boolean
      required:
      - kind
      - verified
    AccountSummaryResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifierSummary'
      required:
      - account_id
      - created_at
      - identifiers
    CreateDeviceRequestRequest:
      type: object
      properties:
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: ne
    CreateDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_token:
          type: string
      required:
      - device_id
      - device_token
    EmailSignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - email
      - password
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    HealthDeepResponse:
      type: object
      properties:
        status:
          type: string
        services:
          $ref: '#/components/schemas/HealthDeepServices'
      required:
      - services
      - status
    HealthDeepServices:
      type: object
      properties:
        postgres:
          type: boolean
        redis:
          type: boolean
        chroma:
          type: boolean
        neo4j:
          type: boolean
      required:
      - chroma
      - neo4j
      - postgres
      - redis
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LocaleEnum:
      enum:
      - ne
      - ne-Latn
      - hi-Latn
      - en
      type: string
      description: |-
        * `ne` - ne
        * `ne-Latn` - ne-Latn
        * `hi-Latn` - hi-Latn
        * `en` - en
    LoginError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
      required:
      - account_id
    LogoutResponse:
      type: object
      properties:
        device_token:
          type: string
        device_id:
          type: string
          format: uuid
      required:
      - device_id
      - device_token
    PasswordChangeError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    PasswordChangeResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    PasswordResetConfirmError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - new_password
      - token
    PasswordResetConfirmResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PasswordResetResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    RecoverError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    RecoverResponse:
      type: object
      properties:
        recovery_code:
          type: string
      required:
      - recovery_code
    RecoveryRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        recovery_code:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - new_password
      - recovery_code
      - username
    SignupRequest:
      oneOf:
      - $ref: '#/components/schemas/EmailSignupRequest'
      - $ref: '#/components/schemas/UsernameSignupRequest'
    SignupResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        recovery_code:
          type: string
      required:
      - account_id
    UsernameSignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]{3,32}$
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - password
      - username
    VerifyEmailError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    VerifyEmailRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    VerifyEmailResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    WhoamiResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
      required:
      - device_id
  securitySchemes:
    DeviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: The token returned once by POST /api/devices/. The server stores
        only its SHA-256 hash, so it cannot be recovered if the client loses it.
